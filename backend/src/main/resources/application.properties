# Application Configuration
spring.application.name=image-upscaler-backend

# Custom server port
server.port=8808

# Multipart upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Upscaler Custom Limits
upscaler.image.max-width=8192
upscaler.image.max-height=8192
upscaler.image.min-width=16
upscaler.image.min-height=16
upscaler.image.max-scale-factor=8

# Concurrency & Workload Limits
upscaler.concurrency.max-concurrent-jobs=3
upscaler.concurrency.acquire-timeout-seconds=5

# Tomcat bounded thread pool to avoid uncontrolled resource allocation
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=25

# CORS allowed origins (comma-separated or wildcard pattern)
upscaler.cors.allowed-origins=*

# Real-ESRGAN AI Pro Configuration
# Disabled by default; enable explicitly for local testing.
upscaler.ai.enabled=${UPSCALER_AI_ENABLED:false}
upscaler.ai.executable=${UPSCALER_AI_EXECUTABLE:}
upscaler.ai.model-dir=${UPSCALER_AI_MODEL_DIR:}
upscaler.ai.gpu-id=${UPSCALER_AI_GPU_ID:1}
upscaler.ai.tile-size=${UPSCALER_AI_TILE_SIZE:128}
upscaler.ai.timeout-seconds=${UPSCALER_AI_TIMEOUT_SECONDS:180}
